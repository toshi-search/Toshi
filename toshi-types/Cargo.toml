[package]
name    = "toshi-types"
version = "0.1.1"
authors = ["Stephen Carman <shcarman@gmail.com>"]
description = "The types for a full text search engine based on Tantivy"
repository = "https://github.com/toshi-search/Toshi"
license = "MIT"
edition = "2021"
resolver = "2"

[dependencies]
http        = "1.4.2"
thiserror   = "2.0.18"
anyhow      = "^1.0"
serde       = "^1.0"
serde_json  = "^1.0"
tantivy     = "0.26.1"
async-trait = "^0.1"
dashmap     = { version = "6.2.1", features = ["serde"] }
slog = "^2.7"
tokio = { version = "^1.13", features = ["sync"] }
toml = "1.1.2+spec-1.1.0"

[dependencies.hyper]
version  = "1.10.1"
optional = true

[dependencies.http-body-util]
version  = "0.1.3"
optional = true

[dependencies.bytes]
version  = "^1"
optional = true

[features]
default      = ["extra-errors"]
extra-errors = ["hyper", "http-body-util", "bytes"]
