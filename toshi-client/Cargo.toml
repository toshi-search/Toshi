[package]
name    = "toshi"
version = "0.1.1"
authors = ["Stephen Carman <shcarman@gmail.com>"]
description = "A client for a full text search engine based on Tantivy"
repository = "https://github.com/toshi-search/Toshi"
license = "MIT"
edition = "2021"
autoexamples = false

[[example]]
name = "sync_search"
required-features = ["isahc_client"]

[[example]]
name = "bool_query"

[[example]]
name = "exact_query"

[[example]]
name = "range_query"

[[example]]
name = "hyper_example"
required-features = ["hyper_client"]

[features]
default = ["isahc_client"]
isahc_client = ["isahc"]
hyper_client = ["hyper", "hyper-util", "http-body-util", "bytes"]
tls = ["hyper_client", "hyper-tls"]
rust_tls = ["hyper_client", "hyper-rustls"]

[dependencies]
toshi-types = { path = "../toshi-types" }
async-trait = "^0.1"
http        = "1.4.2"
thiserror   = "2.0.18"
serde       = "^1.0"
serde_json  = "^1.0"
tantivy = "0.26.1"
tokio = { version = "^1.13", features = ["full"] }
bytes = { version = "^1", optional = true }

[dependencies.isahc]
version = "2.0.0"
features = ["json"]
optional = true

[dependencies.hyper]
version = "1.10.1"
features = ["full"]
optional = true

[dependencies.hyper-util]
version = "0.1.20"
features = ["client", "client-legacy", "http1", "tokio"]
optional = true

[dependencies.http-body-util]
version = "0.1.3"
optional = true

[dependencies.hyper-tls]
version = "0.6.0"
optional = true

[dependencies.hyper-rustls]
version = "0.27.9"
optional = true

[dev-dependencies]
tokio = "^1"
