[package]
name = "toshi-server"
version = "0.1.1"
authors = ["Stephen Carman <shcarman@gmail.com>"]
description = "A full text search engine based on Tantivy"
repository = "https://github.com/toshi-search/Toshi"
license = "MIT"
edition = "2024"
resolver = "3"

[[bin]]
name = "toshi"

[lib]
path = "src/lib.rs"

[features]
extra_tokenizers  = ["cang-jie"]

[dependencies]
toshi-types       = { path = "../toshi-types" }
http              = "1.4.2"
bytes             = "^1"
hyper             = { version = "1.10.1", features = ["full"] }
hyper-util        = { version = "0.1.20", features = ["server", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
http-body-util    = "0.1.3"
serde_json        = "^1.0"
serde_urlencoded  = "^0.7"
futures           = "^0.3"
tantivy           = "0.26.1"
tokio             = { version = "^1", features = ["full"] }
async-trait       = "^0.1"
config            = "0.15.24"
structopt         = "^0.3"
thiserror         = "^2"
anyhow            = "^1.0"
dashmap           = "6.2.1"
serde             = { version = "^1.0", features = ["derive"] }
clap              = { version = "^4", features = ["color"] }
slog              = "^2.8"
slog-stdlog       = "^4.1"
slog-scope        = "^4.4"
log               = { version = "*", features = ["max_level_trace", "release_max_level_warn"] }
sloggers          = "^2"
toml              = "1.1.2"
flume             = { version = "0.12.0", features = ["async"] }
itertools         = "0.15.0"
tokio-stream      = "^0.1"
tokio-util        = { version = "^0.7", features = ["full"] }
cang-jie          = { version = "0.19.0", optional = true }


[dev-dependencies]
remove_dir_all    = "1.0.0"
pretty_assertions = "^1"
tokio-test        = "^0.4"
toshi             = { path = "../toshi-client", default-features = false, features = ["hyper_client"] }
